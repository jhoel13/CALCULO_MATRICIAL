name: Publicar Piezómetro 3D

on:
  push:
    branches: [main]
    paths:
      - 'public/piezometro/**'
      - 'public/piezometro-pages.html'
      - '.github/workflows/piezometro-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: piezometro-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener archivos del simulador
        uses: actions/checkout@v6
        with:
          sparse-checkout: public
          persist-credentials: false
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos públicos
        run: |
          mkdir -p _site/piezometro
          cp -R public/piezometro/. _site/piezometro/
          cp public/piezometro-pages.html _site/index.html
          touch _site/.nojekyll
      - name: Subir simulador
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
